<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Engineering Roadway Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="roadwayCanvas"></canvas>
    <div class="content">
        <h1>Data Engineering Journey</h1>
        <p>Navigate through the world of data science and engineering</p>
    </div>
    <script src="animation.js"></script>
    <script>
        // Fallback check
        window.addEventListener('load', function() {
            const canvas = document.getElementById('roadwayCanvas');
            if (canvas) {
                console.log('Canvas loaded:', canvas.width, 'x', canvas.height);
            } else {
                console.error('Canvas element missing!');
            }
        });
    </script>
</body>
</html>
